<script>
// Runs before the page module, so a module that fails to load or throw
// still ends up on screen: on the static desktop below (the markup React
// replaces once src/main.tsx runs) the boot indicator turns red and the
// failure card shows the message; src/ui.ts shows everything recorded here
// once it runs. Also what the first paint needs from storage: the saved
// wallpaper's hint (desktop.ts HINT_KEY) and compact mode for a mobile
// user agent without a touch screen (config.ts mobile).
(() => {
	const KW = window.KW = { t0: Date.now(), errors: [], ui: null, started: false };
	const root = document.documentElement;
	try {
		const h = JSON.parse(localStorage.getItem("kw.wallpaper-hint") || "null");
		if (h && typeof h.css === "string") {
			root.style.setProperty("--wp-hint", h.css);
			root.setAttribute("data-wp-hint", "");
			root.setAttribute("data-wallpaper", h.light ? "light" : "dark");
		}
	} catch {}
	if (/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)) root.classList.add("kw-mobile");
	const el = (id) => document.getElementById(id);
	// Before src/ui.ts takes over: the indicator and the card on the static desktop.
	KW.early = (e) => {
		if (!e.fatal || !el("tb-boot")) return;
		el("tb-boot").setAttribute("data-error", "");
		const title = el("tb-boot-title"), msg = el("tb-boot-msg"), card = el("boot-error");
		if (title) { title.textContent = "Couldn't start"; title.hidden = false; }
		if (msg) { msg.textContent = e.message; msg.className = "sr-only"; }
		if (card) {
			el("boot-error-msg").textContent = e.message;
			el("boot-error-detail").textContent = e.detail || "";
			el("boot-error-detail").hidden = !e.detail;
			card.hidden = false;
		}
	};
	KW.report = (kind, message, detail, fatal) => {
		const e = { t: Date.now() - KW.t0, kind, message: String(message), detail: detail ? String(detail) : "", fatal: !!fatal };
		KW.errors.push(e);
		try { if (KW.ui) KW.ui.onError(e); else KW.early(e); } catch { KW.early(e); }
		return e;
	};
	addEventListener("error", (ev) => {
		const t = ev.target;
		if (t && t !== window && t.tagName) {
			const url = t.src || t.href || "";
			// A failed script is fatal; a failed stylesheet only degrades the look.
			KW.report("resource", "Failed to load " + (t.type === "module" ? "the page module " + url + " or a module it imports" : url),
				"<" + t.tagName.toLowerCase() + "> load error (404, network or MIME type)", t.tagName === "SCRIPT");
			return;
		}
		KW.report("exception", ev.message || "Script error", ev.error?.stack || (ev.filename ? ev.filename + ":" + ev.lineno + ":" + ev.colno : ""), !KW.started);
	}, true);
	addEventListener("unhandledrejection", (ev) => {
		const r = ev.reason;
		KW.report("rejection", "Unhandled promise rejection: " + (r?.message ?? String(r)), r?.stack ?? "", !KW.started);
	});
	setTimeout(() => {
		if (!KW.ui) KW.report("watchdog", "The page script did not run",
			"The page module failed to load or parse, or the browser is too old for it (Chrome/Edge 137+, Firefox 153+ or Safari 27+ is needed anyway). Check the network and the server log.", true);
	}, 8000);
})();
</script>

<body>
<!-- React (src/main.tsx) renders the page here. Until then, and if the page
     module never runs, this is what shows: the desktop as components/App.tsx
     first draws it (inert): the console's window (Workspace.tsx) with its
     placeholder, the Dock (Dock.tsx: Apps, dimmed until the system runs,
     the console's tile, Settings) and the top bar (TopBar.tsx: the mark, the
     boot indicator, the power button); the failure card is for a failure
     before then. -->
<div id="root">
	<div id="app" data-state="checking" data-blank="start" inert class="fixed inset-x-0 top-0 flex h-dvh flex-col">

		<script>if (document.documentElement.classList.contains("kw-mobile") || matchMedia("(max-width: 639.98px), (pointer: coarse)").matches) document.getElementById("app").classList.add("compact");</script>
		<div class="relative flex min-h-0 flex-1">

						</section>
					</div>
				</div>
			</main>
		</div>
		<footer id="dock" class="relative flex flex-none items-center justify-center select-none">
			<nav class="dock-pill">
				<button type="button" class="dock-tile group relative flex-none" data-off aria-disabled="true"><span class="dock-face"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4" height="4" rx="1" /><rect x="10" y="4" width="4" height="4" rx="1" /><rect x="16" y="4" width="4" height="4" rx="1" /><rect x="4" y="10" width="4" height="4" rx="1" /><rect x="10" y="10" width="4" height="4" rx="1" /><rect x="16" y="10" width="4" height="4" rx="1" /><rect x="4" y="16" width="4" height="4" rx="1" /><rect x="10" y="16" width="4" height="4" rx="1" /><rect x="16" y="16" width="4" height="4" rx="1" /></svg></span></button>
				<div class="dock-apps"><button type="button" class="dock-tile group relative flex-none" aria-pressed="true"><span class="dock-face"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 7 5 5-5 5M12.5 17H19" /></svg></span><span aria-hidden="true" class="dock-dot" data-dot="on"></span></button><button type="button" class="dock-tile group relative flex-none"><span class="dock-face"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5" /><circle cx="12" cy="12" r="2.5" /><path d="M18.5 12H21M12 18.5V21M5.5 12H3M12 5.5V3M16.6 16.6l1.8 1.8M7.4 16.6l-1.8 1.8M7.4 7.4 5.6 5.6M16.6 7.4l1.8-1.8" /></svg></span></button></div>
			</nav>
		</footer>
		<header id="topbar">
			<nav class="tb-left">
				<div id="tb-boot" role="status" aria-live="polite" class="tb-boot">

		</section>
	</div>
