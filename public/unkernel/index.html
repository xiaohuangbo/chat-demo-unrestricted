<script>
// Runs before the page module, so a module that fails to load or throw
// still ends up on screen: the splash card and the status line below (the
// markup React replaces once src/main.tsx runs) turn red, and src/ui.ts
// shows everything recorded here once it runs.
(() => {
	const KW = window.KW = { t0: Date.now(), errors: [], ui: null, started: false };
	const el = (id) => document.getElementById(id);
	// Before src/ui.ts takes over: show the error on the splash card and the status line.
	KW.early = (e) => {
		if (!e.fatal || !el("splash")) return;
		el("app").setAttribute("data-state", "error");
		el("status-label").textContent = "错误";
		el("status-label").classList.remove("sr-only");
		el("splash").setAttribute("data-error", "");
		el("splash-title").textContent = "无法启动";
		el("splash-msg").textContent = e.message + (e.detail ? "\n\n" + e.detail : "");
	};
	KW.report = (kind, message, detail, fatal) => {
		const e = { t: Date.now() - KW.t0, kind, message: String(message), detail: detail ? String(detail) : "", fatal: !!fatal };
		KW.errors.push(e);
		try { if (KW.ui) KW.ui.onError(e); else KW.early(e); } catch { KW.early(e); }
		return e;
	};
	addEventListener("error", (ev) => {
		const t = ev.target;
		if (t && t !== window && t.tagName) {
			const url = t.src || t.href || "";
			// A failed script is fatal; a failed stylesheet only degrades the look.
			KW.report("resource", "Failed to load " + (t.type === "module" ? "the page module " + url + " or a module it imports" : url),
				"<" + t.tagName.toLowerCase() + "> load error (404, network or MIME type)", t.tagName === "SCRIPT");
			return;
		}
		KW.report("exception", ev.message || "Script error", ev.error?.stack || (ev.filename ? ev.filename + ":" + ev.lineno + ":" + ev.colno : ""), !KW.started);
	}, true);
	addEventListener("unhandledrejection", (ev) => {
		const r = ev.reason;
		KW.report("rejection", "Unhandled promise rejection: " + (r?.message ?? String(r)), r?.stack ?? "", !KW.started);
	});
	setTimeout(() => {
		const s = !KW.ui && el("splash");
		if (s) s.setAttribute("data-slow", "");
	}, 1500);
	setTimeout(() => {
		if (!KW.ui) KW.report("watchdog", "The page script did not run",
			"The page module failed to load or parse, or the browser is too old for it (Chrome/Edge 137+, Firefox 153+ or Safari 27+ is needed anyway). Check the network and the server log.", true);
	}, 8000);
})();
</script>

		<main id="stage" class="relative min-h-0 flex-1">

					<p id="splash-msg" class="font-mono text-[12.5px] break-words text-muted group-data-error:whitespace-pre-wrap group-data-error:text-fg">正在加载页面脚本…</p>

			</div>
		</main>
		<footer id="bar" class="flex min-h-[calc(var(--bar-h)+var(--sb))] items-stretch gap-2 border-t border-line bg-surface pr-1 pb-(--sb) font-mono text-[12px] leading-none">

			<span id="status" class="inline-flex items-center px-1.5"><span id="status-label" class="sr-only">正在启动</span></span>
		</footer>
	</div>
</div>
